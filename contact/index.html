<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Andy Cai</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <main>
        <h1>Contact Me</h1>

        <p>
            Have a question or want to get in touch?
            Send me a message using the form below.
        </p>

        <form action="mailto:adcai@ucsd.edu"
              method="post"
              enctype="text/plain">

            <label for="email">
                Email:
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="yourname@example.com"
                    required
                >
            </label>

            <label for="subject">
                Subject:
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter a subject"
                    required
                >
            </label>

            <label for="message">
                Message:
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </label>

            <button type="submit">Send Message</button>
        </form>
    </main>
    <script type="module" src="../global.js"></script>
</body>
</html>
